name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Catalogo.sln
      - run: dotnet build Catalogo.sln --no-restore -c Release
      - run: dotnet test Catalogo.sln --no-build -c Release --verbosity normal

  web:
    name: Web (Vite + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
